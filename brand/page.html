<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    width: 100%; height: 100%;
  }
  .mark { display: flex; align-items: center; gap: 30px; padding: 34px 44px; }
  .logo { width: 132px; height: 132px; flex-shrink: 0; }
  .txt { display: flex; flex-direction: column; gap: 11px; }
  .name { display: flex; align-items: baseline; gap: 15px; line-height: 1; }
  .name b { font-size: 66px; font-weight: 800; letter-spacing: .02em; }
  .name span { font-size: 45px; font-weight: 300; letter-spacing: .16em; }
  .site {
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 37px; letter-spacing: .04em; line-height: 1;
  }

  /* Светлый знак — для тёмного или обычного видео.
     Тень нужна, чтобы надпись читалась и на светлом кадре. */
  body.light .name b { color: #fff; }
  body.light .name span { color: #cfd4dc; }
  body.light .site { color: #8ad455; }
  body.light .txt { text-shadow: 0 3px 16px rgba(0, 0, 0, .8), 0 0 5px rgba(0, 0, 0, .65); }

  /* Тёмный знак — для светлого видео */
  body.dark .name b { color: #14181e; }
  body.dark .name span { color: #4a515c; }
  body.dark .site { color: #3f8019; }
  body.dark .txt { text-shadow: 0 1px 6px rgba(255, 255, 255, .8); }

  /* Плашка — знак на полупрозрачной подложке, читается на любом кадре */
  body.plate .mark {
    background: rgba(11, 13, 17, .72);
    border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 30px;
  }
  body.plate .name b { color: #fff; }
  body.plate .name span { color: #cfd4dc; }
  body.plate .site { color: #8ad455; }
</style>
</head>
<body>
  <div class="mark">
    <svg class="logo" viewBox="0 0 48 48">
      <path d="M24 4 44 15 24 26 4 15Z" fill="#8fd45a"/>
      <path d="M4 15 24 26v18L4 33Z" fill="#5da336"/>
      <path d="M44 15 24 26v18l20-11Z" fill="#3f7526"/>
      <path d="M24 4 44 15 24 26 4 15Z" fill="none" stroke="#0d0e11" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M4 15v18l20 11 20-11V15" fill="none" stroke="#0d0e11" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M24 26v18" fill="none" stroke="#0d0e11" stroke-width="1.4"/>
    </svg>
    <div class="txt">
      <div class="name"><b>PLUS</b><span>LAUNCHER</span></div>
      <div class="site">plus-launcher.fun</div>
    </div>
  </div>
</body>
</html>
